<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excursiones</title>
</head>
<body class="body-class">
    <header class="header-class">
        <h1>Turismo Honduras</h1>
        <p>Descubre la riqueza historica, natural y cultural de nuestra patria</p>
        <nav class="nav-class">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="destinos.html">Destinos</a></li>
                <li><a href="cultura.html">Cultura y gastronomia</a></li>
                <li><a href="excursiones.html">Excursiones</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <main class="main-class">
        <section class="section-titulo-class">
            <h2>Reservaciones y Solicitud de Tours</h2>
        </section>
        <section class="section-class">
            <h2>Formulario de Solicitud</h2>
            <form action="submit" method="post" class="form-class">
                <div class="form-group-class">
                    <label for="nombre">Nombre completo:</label><br>
                    <input type="text" id="nombre" name="nombre" required placeholder="ej: Juan Perez">
                </div>
                <div class="form-group-class">
                    <label for="telefono">Numero telefonico:</label><br>
                    <input type="tel" id="telefono" name="telefono" required pattern="[0-9]{8,8}" placeholder="99887766">
                </div>
                <div class="form-group-class">
                    <label for="correo">Correo:</label><br>
                    <input type="email" id="correo" name="correo" required placeholder="ejemplo@correo.com">
                </div>
                <div class="form-group-class">
                    <label for="destino">Destino:</label><br>
                    <select id="destino" name="destino" required>
                        <option value="">Seleccione una opcion</option>
                        <option value="copan">Ruta Maya - Copan Ruinas</option>
                        <option value="lenca">Ruta Lenca - Gracias y La Esperanza</option>
                        <option value="ecoturismo">Ecoturismo - Parque Nacional Pico Bonito</option>
                        <option value="caribe">Caribe - Roatan y Cayos Cochinos</option>
                    </select>
                </div>
                <div class="form-group-class">
                    <label for="fecha-inicio">Fecha prevista de inicio:</label><br>
                    <input type="date" id="fecha-inicio" name="fecha_inicio" required>
                </div>
                <div class="form-group-class">
                    <label for="fecha-retorno">Fecha prevista de retorno:</label><br>
                    <input type="date" id="fecha-retorno" name="fecha_retorno" required>
                </div>
                <div class="form-group-class">
                    <label for="adultos">Numero de adultos:</label><br>
                    <input type="number" id="adultos" name="adultos" min="1" max="20" value="1" required>
                </div>
                <div class="form-group-class">
                    <label for="menores">Numero de menores:</label><br>
                    <input type="number" id="menores" name="menores" min="0" max="20" value="0" required>
                </div>
                <div class="form-group-class">
                    <label for="hospedaje">Tipo de hospedaje requerido:</label><br>
                    <select id="hospedaje" name="hospedaje" required>
                        <option value="">Seleccione una opcion</option>
                        <option value="cabana">Cabaña ecologica</option>
                        <option value="hotel">Hotel colonial</option>
                        <option value="campamento">Campamento de montaña</option>
                    </select>
                </div>
                <div class="checkbox-class">
                    <label>Necesidades adicionales:</label><br>
                    <input type="checkbox" id="accesibilidad" name="necesidades[]" value="accesibilidad">
                    <label for="accesibilidad">Accesibilidad para movilidad </label><br>
                    <input type="checkbox" id="guia" name="necesidades[]" value="guia_bilingue">
                    <label for="guia">Guia bilingüe</label><br>
                    <input type="checkbox" id="guia-ciegos" name="necesidades[]" value="guia_ciegos">
                    <label for="guia-ciegos">Guia para personas con discapacidad visual</label>
                </div>
                <div class="checkbox-class">
                    <input type="checkbox" id="compromiso" name="compromiso" required>
                    <label for="compromiso">Acepto los compromisos de conservacion ecologica y proteccion del patrimonio</label>
                </div>
                <div class="button-class">
                    <button type="submit">Enviar solicitud</button>
                </div>
            </form>
        </section>
    </main>
    <footer class="footer-class">
        <p>&copy; 2026 Turismo honduras, Todos los derechos reservados</p>
    </footer>
</body>
</html>
